name: Publish

# Stages the release on npm. Once it's done, approve the staged version on
# npmjs.com, then run the "Publish to MCP Registry" workflow.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      # Trusted publishing and `npm stage publish` need npm 11.15 or newer,
      # which ships with Node 24 but not Node 22.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          scope: '@corralimited'

      - run: pnpm install --no-frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: pnpm codegen

      - run: pnpm build

      # No token: npm trusts this workflow through the trusted publisher set up
      # on npmjs.com. The version can't be installed until someone approves it.
      - run: npm stage publish --access public

      - name: Next steps
        run: |
          echo "Staged $GITHUB_REF_NAME on npm. Approve it under Staged Packages at https://www.npmjs.com/package/@corralimited/snapdiff-mcp, then run the Publish to MCP Registry workflow." >> "$GITHUB_STEP_SUMMARY"
