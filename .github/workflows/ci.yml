name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --no-frozen-lockfile

      - name: server.json / package.json consistency
        # The MCP Registry validates the npm package's `mcpName` against the
        # server.json `name`, and rejects version mismatches. Catch drift in CI
        # rather than at release time.
        run: |
          PKG_NAME=$(jq -r '.mcpName' package.json)
          SRV_NAME=$(jq -r '.name' server.json)
          PKG_VER=$(jq -r '.version' package.json)
          SRV_VER=$(jq -r '.version' server.json)
          SRV_PKG_VER=$(jq -r '.packages[0].version' server.json)
          [ "$PKG_NAME" = "$SRV_NAME" ] || { echo "::error::package.json mcpName ($PKG_NAME) != server.json name ($SRV_NAME)"; exit 1; }
          [ "$PKG_VER" = "$SRV_VER" ] || { echo "::error::package.json version ($PKG_VER) != server.json version ($SRV_VER)"; exit 1; }
          [ "$PKG_VER" = "$SRV_PKG_VER" ] || { echo "::error::package.json version ($PKG_VER) != server.json packages[0].version ($SRV_PKG_VER)"; exit 1; }

      - name: Codegen drift check
        # Regenerate openapi-types.ts from the @corralimited/snapdiff-openapi
        # package and fail if it differs from what's committed.
        run: |
          pnpm codegen
          git diff --exit-code src/openapi-types.ts \
            || (echo "::error::src/openapi-types.ts is stale. Run 'pnpm codegen' and commit."; exit 1)

      - run: pnpm build
